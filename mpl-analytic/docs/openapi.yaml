  /api/heroes/{hero_id}/games:
    get:
      tags:
      - Heroes
      summary: Riwayat pertandingan game yang melibatkan hero tersebut
      operationId: getHeroGames
      parameters:
      - $ref: '#/components/parameters/HeroId'
      responses:
        '200':
          description: Riwayat game hero berhasil diambil.
