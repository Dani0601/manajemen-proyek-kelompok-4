openapi: 3.0.3
info:
  title: MPL Analytic API
  version: 1.2.0
  description: 'Spesifikasi OpenAPI komprehensif untuk backend RESTful MPL Analytic
    berbasis PHP Native.

    Dilengkapi dengan semua endpoint aktif dan rute sistem, semua kondisi error lengkap
    (400 Bad Request, 404 Not Found, 405 Method Not Allowed, 501 Not Implemented,
    500 Server Error), serta contoh respon payload data riil (examples).'
servers:
- url: http://127.0.0.1/manajemen-proyek-kelompok-4/mpl-analytic/public
  description: Apache / Laragon Server (Development Utama)
- url: http://localhost:8000
  description: PHP Built-in Server (Local Development)
- url: http://manajemen-proyek-kelompok-4.test
  description: Laragon VirtualHost
tags:
- name: Dashboard
  description: Ringkasan statistik musim aktif, hero top win/pick/ban rate, dan jadwal
    pertandingan
- name: Meta
  description: Master data kompetisi, season, tim, dan ringkasan meta hero overpower
    & banned
- name: Heroes
  description: Katalog hero, pencarian nama & filter role, detail hero, statistik,
    build, counter, skill, dan game
- name: Players
  description: Master pemain, komparasi head-to-head 2 pemain (US-03), profil detail,
    statistik, dan riwayat game
- name: Tournaments
  description: Daftar turnamen/musim, detail musim, klasemen tim (standings), dan
    jadwal match
- name: Matches
  description: Detail statistik pertandingan dan riwayat draft pick & ban per match
- name: Games
  description: Rincian game individual, statistik pemain, pick hero, item build, dan
    talent emblem
- name: Items
  description: Master data item peralatan dalam game dan atribut spesifik
paths:
  /api/dashboard:
    get:
      tags:
      - Dashboard
      summary: Ringkasan statistik dashboard kompetisi dan hero
      operationId: getDashboard
      parameters:
      - name: season
        in: query
        required: false
        description: 'Filter berdasarkan ID Season (default: season aktif terbaru)'
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: Data dashboard berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                ActiveSeason:
                  summary: Musim aktif berisi data pertandingan
                  value:
                    success: true
                    message: Data dashboard berhasil diambil.
                    data:
                      season:
                        season_id: 1
                        league: MPL Indonesia
                        season_number: 17
                        phase: Regular Season
                        start_date: '2026-03-01'
                        end_date: '2026-05-30'
                        format: Double Round Robin, Bo3
                      last_week: 8
                      top_pick_rate:
                      - hero_id: 12
                        hero_name: Claude
                        role: Marksman
                        total_picks: 45
                        pick_rate: 62.5
                      top_win_rate:
                      - hero_id: 34
                        hero_name: Grock
                        role: Tank
                        total_games: 28
                        win_rate: 71.4
                      top_ban_rate:
                      - hero_id: 88
                        hero_name: Joy
                        role: Assassin
                        total_bans: 50
                        ban_rate: 69.4
                      schedule:
                      - schedule_id: s17_w08_m01
                        season_id: 1
                        week: 8
                        date: '2026-05-15'
                        time: '15:00'
                        team1: RRQ Hoshi
                        team2: ONIC
                        score_team1: 2
                        score_team2: 1
                        status: completed
                        winner: RRQ Hoshi
                EmptySeason:
                  summary: Musim kosong belum ada pertandingan
                  value:
                    success: true
                    message: Data dashboard berhasil diambil.
                    data:
                      season:
                        season_id: 99
                        season_number: 99
                      last_week: null
                      top_pick_rate: []
                      top_win_rate: []
                      top_ban_rate: []
                      hero_meta: []
                      schedule: []
        '404':
          description: Season tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Season tidak ditemukan.
                data: null
                error:
                  code: SEASON_NOT_FOUND
        '405':
          description: Method HTTP tidak diizinkan (hanya GET didukung).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Method tidak diizinkan.
                data: null
                error:
                  code: METHOD_NOT_ALLOWED
  /api/meta:
    get:
      tags:
      - Meta
      summary: Ringkasan meta Top 5 Hero Overpowered & Most Banned
      operationId: getMetaSummary
      parameters:
      - name: season
        in: query
        required: false
        description: 'ID season yang ingin dianalisis (default: 17)'
        schema:
          type: integer
          example: 17
      responses:
        '200':
          description: Ringkasan statistik meta hero berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Berhasil mengambil ringkasan dashboard Top 5 Hero.
                data:
                  season: 17
                  top_overpowered_heroes:
                  - hero_id: 12
                    hero_name: Claude
                    hero_icon_url: https://cdn.mplanalytic.com/heroes/claude.png
                    win_rate: 68.5
                    pick_rate: 45.0
                    ban_rate: 30.0
                  top_most_banned_heroes:
                  - hero_id: 88
                    hero_name: Joy
                    hero_icon_url: https://cdn.mplanalytic.com/heroes/joy.png
                    win_rate: 55.0
                    pick_rate: 20.0
                    ban_rate: 75.0
        '404':
          description: Data statistik tidak ditemukan untuk season yang diminta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Tidak ada data statistik yang ditemukan untuk season ini.
                data: null
        '405':
          description: Method HTTP tidak diizinkan (hanya GET didukung).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Method tidak diizinkan.
                data: null
                error:
                  code: METHOD_NOT_ALLOWED
        '501':
          description: Fitur/Endpoint belum diimplementasikan di backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Endpoint belum diimplementasikan.
                data: null
                error:
                  code: NOT_IMPLEMENTED
  /api/seasons:
    get:
      tags:
      - Meta
      summary: Master data seluruh musim turnamen (seasons)
      operationId: listSeasons
      responses:
        '200':
          description: Daftar musim berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Data seasons berhasil diambil.
                data:
                - season_id: 1
                  league: MPL Indonesia
                  season_number: 17
                  phase: Regular Season
                  start_date: '2026-03-01'
                  end_date: '2026-05-30'
        '405':
          description: Method HTTP tidak diizinkan (hanya GET didukung).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Method tidak diizinkan.
                data: null
                error:
                  code: METHOD_NOT_ALLOWED
        '501':
          description: Fitur/Endpoint belum diimplementasikan di backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Endpoint belum diimplementasikan.
                data: null
                error:
                  code: NOT_IMPLEMENTED
  /api/teams:
    get:
      tags:
      - Meta
      summary: Master data tim peserta kompetisi
      operationId: listTeams
      responses:
        '200':
          description: Daftar tim berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Data teams berhasil diambil.
                data:
                - team_id: 1
                  team_name: RRQ Hoshi
                  team_code: RRQ
                  logo_url: https://id-mpl.com/assets/teams/rrq.png
                - team_id: 2
                  team_name: ONIC
                  team_code: ONIC
                  logo_url: https://id-mpl.com/assets/teams/onic.png
        '405':
          description: Method HTTP tidak diizinkan (hanya GET didukung).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Method tidak diizinkan.
                data: null
                error:
                  code: METHOD_NOT_ALLOWED
        '501':
          description: Fitur/Endpoint belum diimplementasikan di backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Endpoint belum diimplementasikan.
                data: null
                error:
