  /api/heroes/search:
    get:
      tags:
      - Heroes
      summary: Pencarian hero khusus berdasarkan nama dan role
      operationId: searchHeroes
      parameters:
      - name: q
        in: query
        required: false
        description: Keyword nama hero
        schema:
          type: string
          example: Miya
      - name: role
        in: query
        required: false
        description: Filter role hero
        schema:
          type: string
          example: Marksman
      responses:
        '200':
          description: Hasil pencarian hero berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Hasil pencarian hero berhasil diambil.
                data:
                - hero_id: 1
                  hero_name: Miya
                  role: Marksman
                  hero_slug: miya
        '405':
