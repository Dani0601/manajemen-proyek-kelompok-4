  /api/heroes/{hero_id}:
    get:
      tags:
      - Heroes
      summary: Detail spesifik satu hero
      operationId: getHeroDetail
      parameters:
      - $ref: '#/components/parameters/HeroId'
      responses:
        '200':
          description: Detail hero berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Detail hero berhasil diambil.
                data:
                  hero_id: 1
                  hero_name: Miya
                  role: Marksman
                  specialty: Reap/Damage
                  hero_slug: miya
                  created_at: '2026-01-01 00:00:00'
        '400':
          description: Validasi parameter hero_id gagal (bukan angka positif).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidInteger:
                  summary: hero_id bukan tipe integer
                  value:
                    success: false
                    message: hero_id harus berupa angka.
                    data: null
                    error:
                      code: INVALID_INTEGER
                InvalidHERO_ID:
                  summary: hero_id bernilai 0 atau negatif
                  value:
                    success: false
                    message: hero_id harus lebih besar dari 0.
                    data: null
                    error:
                      code: INVALID_HERO_ID
        '404':
          description: Hero atau sub-endpoint tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                HeroNotFound:
                  summary: Hero tidak ditemukan di database
                  value:
                    success: false
                    message: Hero tidak ditemukan.
                    data: null
                    error:
                      code: HERO_NOT_FOUND
                EndpointNotFound:
                  summary: Sub-endpoint Hero tidak terdaftar
                  value:
                    success: false
                    message: Endpoint hero tidak ditemukan.
                    data: null
                    error:
                      code: ENDPOINT_NOT_FOUND
        '405':
          description: Method HTTP tidak diizinkan (hanya GET didukung).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Method tidak diizinkan.
                data: null
                error:
                  code: METHOD_NOT_ALLOWED
