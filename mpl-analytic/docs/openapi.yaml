openapi: 3.0.3
info:
  title: MPL Analytic API
  version: 1.3.0
  description: 'Spesifikasi OpenAPI komprehensif untuk backend RESTful MPL Analytic
    berbasis PHP Native (MPL Indonesia Season 18).

    Dilengkapi dengan seluruh endpoint kompetisi aktif (Season 18), tim (master, roster
    pemain tim, statistik tim), pemain (master, komparasi head-to-head, detail, statistik
    pemain, riwayat game), hero, match, game, klasemen, jadwal, serta rincian error
    handling lengkap.'
servers:
- url: http://localhost/manajemen-proyek-kelompok-4/mpl-analytic/public
  description: Apache / Laragon Server (Development Utama)
- url: http://localhost:8000
  description: PHP Built-in Server (Local Development)
- url: http://manajemen-proyek-kelompok-4.test
  description: Laragon VirtualHost
tags:
- name: Dashboard
  description: Ringkasan statistik musim aktif Season 18, hero top win/pick/ban rate,
    dan jadwal pertandingan
- name: Meta
  description: Master data kompetisi, season, dan ringkasan meta hero overpower &
    most banned
- name: Teams
  description: Master data tim peserta, roster pemain per tim, dan statistik performa
    tim di kompetisi
- name: Heroes
  description: Katalog 134 hero, pencarian nama & filter role, detail hero, statistik,
    build, counter, skill, dan game
- name: Players
  description: Master pemain, komparasi head-to-head 2 pemain Season 18 (US-03), profil
    detail, statistik, dan riwayat game
- name: Tournaments
  description: Daftar turnamen/musim (Season 18), detail musim, klasemen tim (standings),
    dan jadwal match
- name: Matches
  description: Detail statistik pertandingan Season 18 dan riwayat draft pick & ban
    per match
- name: Games
  description: Rincian game individual Season 18, statistik pemain, pick hero, item
    build, dan talent emblem
- name: Items
  description: Master data item peralatan dalam game dan atribut spesifik
paths:
  /api/dashboard:
    get:
      tags:
      - Dashboard
      summary: Ringkasan statistik dashboard kompetisi dan hero Season 18
      operationId: getDashboard
      parameters:
      - name: season
        in: query
        required: false
        description: 'Filter berdasarkan ID Season (default: season 18 aktif terbaru)'
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: Data dashboard berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                ActiveSeason:
                  summary: Musim aktif Season 18 berisi data kompetisi riil
                  value:
                    success: true
                    message: Data dashboard berhasil diambil.
                    data:
                      season:
                        season_id: 1
                        league: MPL Indonesia
                        season_number: 18
                        phase: Regular Season
                        start_date: null
                        end_date: null
                      last_week: 9
                      top_pick_rate:
                      - hero_id: 7
                        hero_name: Hirara
                        pick_count: 77
                        pick_rate: '58.3333'
                        win_rate: '53.4000'
                        ban_rate: '66.4000'
                      - hero_id: 4
                        hero_name: Belerick
                        pick_count: 67
                        pick_rate: '50.7576'
                        win_rate: '52.2000'
                        ban_rate: '72.4000'
                      top_win_rate:
                      - hero_id: 77
                        hero_name: Aulus
                        pick_count: 20
                        pick_rate: '15.1515'
                        win_rate: '59.5000'
                        ban_rate: '18.6000'
                      top_ban_rate:
                      - hero_id: 7
                        hero_name: Hirara
                        pick_count: 77
                        pick_rate: '58.3333'
                        win_rate: '53.4000'
                        ban_rate: '66.4000'
                      hero_meta: []
                      schedule:
                      - schedule_id: s18_w09_m65
                        season_id: 1
                        week: 9
                        match_date: '2026-10-16'
                        match_time: '15:00:00'
                        team1_id: 3
                        team1_name: Natus Vincere
                        team2_id: 2
                        team2_name: RRQ Hoshi
                        status: completed
                        source: official_mpl
                        source_match_id: '1100'
                EmptySeason:
                  summary: Musim kosong belum ada pertandingan
                  value:
                    success: true
                    message: Data dashboard berhasil diambil.
                    data:
                      season:
                        season_id: 99
                        season_number: 99
                      last_week: null
                      top_pick_rate: []
                      top_win_rate: []
                      top_ban_rate: []
                      hero_meta: []
                      schedule: []
        '404':
          description: Season tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Season tidak ditemukan.
                data: null
                error:
                  code: SEASON_NOT_FOUND
        '405':
          description: Method HTTP tidak diizinkan (hanya GET didukung).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Method tidak diizinkan.
                data: null
                error:
                  code: METHOD_NOT_ALLOWED
