  /api/heroes:
    get:
      tags:
      - Heroes
      summary: Daftar semua hero atau pencarian umum
      operationId: listHeroes
      parameters:
      - name: q
        in: query
        required: false
        description: Keyword pencarian nama hero
        schema:
          type: string
          example: Miya
      - name: role
        in: query
        required: false
        description: Filter role hero
        schema:
          type: string
          example: Marksman
      responses:
        '200':
          description: Data hero berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Data hero berhasil diambil.
                data:
                - hero_id: 1
                  hero_name: Miya
                  role: Marksman
                  hero_slug: miya
                - hero_id: 2
                  hero_name: Balmond
                  role: Fighter
                  hero_slug: balmond
        '405':
          description: Method HTTP tidak diizinkan (hanya GET didukung).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Method tidak diizinkan.
                data: null
