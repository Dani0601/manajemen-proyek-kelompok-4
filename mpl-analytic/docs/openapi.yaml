                  - hero_id: 84
                    hero_name: Yve
                    hero_icon_url: https://cdn.mplanalytic.com/heroes/yve.png
                    win_rate: 100
                    pick_rate: 2.2727
                    ban_rate: 2.27
                  - hero_id: 75
                    hero_name: Bruno
                    hero_icon_url: https://cdn.mplanalytic.com/heroes/bruno.png
                    win_rate: 100
                    pick_rate: 1.5152
                    ban_rate: 1.52
                  top_most_banned_heroes:
                  - hero_id: 4
                    hero_name: Belerick
                    hero_icon_url: https://cdn.mplanalytic.com/heroes/belerick.png
                    win_rate: 52.2
                    pick_rate: 50.7576
                    ban_rate: 72.4
        '404':
          description: Data statistik tidak ditemukan untuk season yang diminta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Tidak ada data statistik yang ditemukan untuk musim ini.
                data: null
                error:
                  code: META_DATA_NOT_FOUND
        '405':
          description: Method HTTP tidak diizinkan (hanya GET didukung).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
