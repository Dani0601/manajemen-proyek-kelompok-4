components:
  parameters:
    HeroId:
      name: hero_id
      in: path
      required: true
      description: ID unik hero (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 1
    PlayerId:
      name: player_id
      in: path
      required: true
      description: ID unik pemain (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 2
    TeamId:
      name: team_id
      in: path
      required: true
      description: ID unik tim peserta (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 1
    TournamentId:
      name: tournament_id
      in: path
      required: true
      description: ID unik turnamen / season (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 1
    MatchId:
      name: match_id
      in: path
      required: true
      description: ID unik match pertandingan (string)
      schema:
        type: string
        example: s18_w01_m01
    GameId:
      name: game_id
      in: path
      required: true
      description: ID unik game pertandingan (string)
      schema:
        type: string
        example: s18_w01_m01_g01
    ItemId:
      name: item_id
      in: path
      required: true
      description: ID unik item perlengkapan (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 1
  schemas:
    SuccessResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Data berhasil diambil.
        data:
          nullable: true
          description: Payload respon
    ErrorResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Terjadi kesalahan.
        data:
          nullable: true
          example: null
        error:
          type: object
          properties:
            code:
              type: string
              example: ERROR_CODE
            detail:
              type: string
    DashboardData:
      type: object
      properties:
        season:
          $ref: '#/components/schemas/Season'
        last_week:
          type: integer
          example: 9
        top_pick_rate:
          type: array
          items:
            type: object
        top_win_rate:
          type: array
          items:
            type: object
        top_ban_rate:
          type: array
          items:
            type: object
        schedule:
          type: array
          items:
            type: object
    Season:
      type: object
      properties:
        season_id:
          type: integer
          example: 1
        league:
          type: string
          example: MPL Indonesia
        season_number:
          type: integer
          example: 18
        phase:
          type: string
          example: Regular Season
        start_date:
          type: string
          format: date
          nullable: true
          example: '2026-08-14'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2026-10-18'
        format:
          type: string
          nullable: true
          example: Double Round Robin, Bo3
    Team:
      type: object
      properties:
        team_id:
          type: integer
          example: 1
        team_name:
          type: string
          example: EVOS
        team_code:
          type: string
          nullable: true
          example: EVOS
        logo_url:
          type: string
          nullable: true
          example: https://cdn.mplanalytic.com/teams/default.png
    Hero:
      type: object
      properties:
        hero_id:
          type: integer
          example: 1
        hero_name:
          type: string
          example: Dyrroth
        role:
          type: string
          example: Fighter
        hero_slug:
          type: string
          example: dyrroth
        hero_url:
          type: string
          nullable: true
          example: https://akmwebstatic.yuanzhanapp.com/web/madmin/image_1604bdeb797af75682b7e3ae3728e3db.png
    Player:
      type: object
      properties:
        player_id:
          type: integer
          example: 2
        player_name:
          type: string
          example: ALBERTTT
        team_id:
          type: integer
          example: 1
        team_name:
          type: string
          example: EVOS
        role:
          type: string
          nullable: true
          example: Jungler
        player_photo_url:
          type: string
          nullable: true
          example: https://cdn.jsdelivr.net/gh/Dani0601/manajemen-proyek-kelompok-4@BEDani/mpl-analytic/public/assets/images/players/alberttt.png
        photo_url:
          type: string
          nullable: true
          example: https://cdn.jsdelivr.net/gh/Dani0601/manajemen-proyek-kelompok-4@BEDani/mpl-analytic/public/assets/images/players/alberttt.png
    Item:
      type: object
      properties:
        item_id:
          type: integer
          example: 1
        item_name:
          type: string
          example: Blade of Despair
        category:
          type: string
          example: Attack
        cost:
          type: integer
          example: 3010
        attributes:
          type: object
          example:
            physical_attack: 160
            movement_spd: 5%
