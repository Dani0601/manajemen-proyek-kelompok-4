components:
  parameters:
    HeroId:
      name: hero_id
      in: path
      required: true
      description: ID unik hero (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 1
    PlayerId:
      name: player_id
      in: path
      required: true
      description: ID unik pemain (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 2
    TournamentId:
      name: tournament_id
      in: path
      required: true
      description: ID unik turnamen / season (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 1
    MatchId:
      name: match_id
      in: path
      required: true
      description: ID unik match pertandingan (string)
      schema:
        type: string
        example: s17_w01_m01
    GameId:
      name: game_id
      in: path
      required: true
      description: ID unik game pertandingan (string)
      schema:
        type: string
        example: s17_w01_m01_g01
    ItemId:
      name: item_id
      in: path
      required: true
      description: ID unik item perlengkapan (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 1
  schemas:
    SuccessResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Data berhasil diambil.
        data:
          nullable: true
          description: Payload respon
    ErrorResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Terjadi kesalahan.
        data:
          nullable: true
          example: null
        error:
          type: object
          properties:
            code:
              type: string
              example: ERROR_CODE
            detail:
              type: string
    DashboardData:
      type: object
      properties:
        season:
          $ref: '#/components/schemas/Season'
        last_week:
          type: integer
          example: 8
        top_pick_rate:
          type: array
          items:
            type: object
        top_win_rate:
          type: array
          items:
            type: object
        top_ban_rate:
          type: array
          items:
            type: object
        schedule:
          type: array
          items:
            type: object
    Season:
      type: object
      properties:
        season_id:
          type: integer
          example: 1
        league:
          type: string
          example: MPL Indonesia
        season_number:
          type: integer
          example: 17
        phase:
          type: string
          example: Regular Season
        start_date:
          type: string
          format: date
          example: '2026-03-01'
        end_date:
          type: string
          format: date
          example: '2026-05-30'
        format:
          type: string
          example: Double Round Robin, Bo3
    Team:
      type: object
      properties:
        team_id:
          type: integer
          example: 1
        team_name:
          type: string
          example: RRQ Hoshi
        team_code:
          type: string
          example: RRQ
        logo_url:
          type: string
          nullable: true
          example: https://id-mpl.com/assets/teams/rrq.png
    Hero:
      type: object
      properties:
        hero_id:
          type: integer
          example: 1
        hero_name:
          type: string
          example: Miya
        role:
          type: string
          example: Marksman
        hero_slug:
          type: string
          example: miya
    Player:
      type: object
      properties:
        player_id:
          type: integer
          example: 2
        player_name:
          type: string
          example: Skylar
        team_id:
          type: integer
          example: 1
        team_name:
          type: string
          example: RRQ Hoshi
        role:
          type: string
          example: Goldlaner
        photo_url:
          type: string
          nullable: true
          example: https://id-mpl.com/assets/players/skylar.png
    Item:
      type: object
      properties:
        item_id:
          type: integer
          example: 1
        item_name:
          type: string
          example: Blade of Despair
        category:
          type: string
          example: Attack
        cost:
          type: integer
          example: 3010
        attributes:
          type: object
          example:
            physical_attack: 160
            movement_spd: 5%
    HeroSkill:
      type: object
      properties:
        hero_skill_id:
          type: integer
          example: 953
        skill_position:
          type: integer
          example: 1
        skill_type:
          type: string
          example: Passive
        skill_name:
          type: string
          example: Wrath of the Abyss
        skill_icon_url:
          type: string
          format: uri
          nullable: true
          example: https://static.wikia.nocookie.net/mobile-legends/images/f/ff/Abysm_Strike.png
        description:
          type: string
          example: When Dyrroth's Rage reaches 50%, he will enhance Burst Strike and Spectre Step.
        tags:
          type: array
          items:
            type: string
          example:
          - Heal
          - Buff
          - Damage
        snapshot_at:
          type: string
          format: date-time
          example: '2026-10-06 13:09:27'
    HeroBuildSpell:
      type: object
      properties:
        hero_build_spell_id:
          type: integer
          example: 309
        spell_name:
          type: string
          example: Flicker
        spell_icon_url:
          type: string
          format: uri
          nullable: true
          example: https://static.wikia.nocookie.net/mobile-legends/images/1/1e/Flicker.png/revision/latest?cb=20210818154536
        share_percent:
          type: string
          example: '28.0000'
        build_count:
          type: integer
          nullable: true
          example: 32
        snapshot_at:
          type: string
          format: date-time
          example: '2026-10-06 13:09:27'

