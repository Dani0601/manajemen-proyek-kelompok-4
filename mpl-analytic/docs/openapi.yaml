        (outgoing) untuk tim tertentu pada MPL Season 18 tanpa parameter season. Mengembalikan
        array kosong jika belum ada riwayat transfer (200 OK).
      operationId: getTeamTransfers
      parameters:
      - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Riwayat transfer tim berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                AdaDataTransfer:
                  summary: Tim memiliki riwayat pemain masuk dan pemain keluar
                  value:
                    success: true
                    message: Riwayat transfer tim berhasil diambil.
                    data:
                      team_id: 1
                      team_name: EVOS Glory
                      team_logo_url: https://cdn.mplanalytic.com/teams/evos.png
                      total_transfers_in: 1
                      total_transfers_out: 1
                      transfers_in:
                      - transfer_id: 101
                        player_id: 2
                        player_name: ALBERTTT
                        player_role: Jungler
                        player_photo_url: https://cdn.jsdelivr.net/gh/Dani0601/manajemen-proyek-kelompok-4@BEDani/mpl-analytic/public/assets/images/players/alberttt.png
                        from_team_id: 2
                        from_team_name: Fnatic ONIC
                        from_team_logo_url: https://cdn.mplanalytic.com/teams/onic.png
                        to_team_id: 1
                        to_team_name: EVOS Glory
                        to_team_logo_url: https://cdn.mplanalytic.com/teams/evos.png
                        transfer_date: '2026-08-15'
                        transfer_type: in
                      transfers_out:
                      - transfer_id: 102
                        player_id: 15
                        player_name: VAN
                        player_role: Jungler
                        player_photo_url: null
                        from_team_id: 1
                        from_team_name: EVOS Glory
                        from_team_logo_url: https://cdn.mplanalytic.com/teams/evos.png
                        to_team_id: 5
                        to_team_name: Bigetron Alpha
                        to_team_logo_url: https://cdn.mplanalytic.com/teams/btr.png
                        transfer_date: '2026-08-10'
                        transfer_type: out
                DataTransferKosong:
                  summary: Tim belum memiliki data transfer (array kosong tanpa error)
                  value:
                    success: true
                    message: Riwayat transfer tim berhasil diambil.
                    data:
                      team_id: 3
                      team_name: RRQ Hoshi
                      team_logo_url: https://cdn.mplanalytic.com/teams/rrq.png
                      total_transfers_in: 0
                      total_transfers_out: 0
                      transfers_in: []
                      transfers_out: []
        '400':
          description: Validasi parameter team_id gagal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidTEAM_ID:
                  summary: team_id bernilai 0 atau negatif
                  value:
                    success: false
                    message: team_id harus lebih besar dari 0.
                    data: null
                    error:
                      code: INVALID_TEAM_ID
                InvalidInteger:
                  summary: team_id bukan integer
                  value:
                    success: false
                    message: team_id harus berupa angka.
                    data: null
                    error:
                      code: INVALID_INTEGER
        '404':
          description: Tim tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Tim tidak ditemukan.
                data: null
                error:
                  code: TEAM_NOT_FOUND
        '405':
          description: Method HTTP tidak diizinkan (hanya GET didukung).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Method tidak diizinkan.
                data: null
                error:
                  code: METHOD_NOT_ALLOWED
  /api/transfers:
    get:
      tags:
      - Teams
      summary: Daftar seluruh riwayat transfer pemain MPL Season 18 (Card 15)
      description: Mengambil master daftar riwayat pergerakan bursa transfer seluruh
        pemain profesional MPL Season 18 dengan dukungan paginasi.
      operationId: getAllTransfers
      parameters:
      - name: page
        in: query
        required: false
        description: 'Nomor halaman transfer (default: 1)'
        schema:
          type: integer
          example: 1
      - name: limit
        in: query
        required: false
        description: 'Jumlah transfer per halaman (default: 20)'
        schema:
          type: integer
          example: 20
      responses:
        '200':
          description: Daftar riwayat transfer pemain berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Data transfer pemain berhasil diambil.
                data:
                  transfers:
                  - transfer_id: 101
                    player_id: 2
                    player_name: ALBERTTT
                    player_role: Jungler
                    player_photo_url: https://cdn.jsdelivr.net/gh/Dani0601/manajemen-proyek-kelompok-4@BEDani/mpl-analytic/public/assets/images/players/alberttt.png
                    from_team_id: 2
                    from_team_name: Fnatic ONIC
                    from_team_logo_url: https://cdn.mplanalytic.com/teams/onic.png
                    to_team_id: 1
                    to_team_name: EVOS Glory
                    to_team_logo_url: https://cdn.mplanalytic.com/teams/evos.png
                    transfer_date: '2026-08-15'
                  pagination:
                    current_page: 1
                    per_page: 20
                    total_data: 1
                    total_pages: 1
        '405':
          description: Method HTTP tidak diizinkan (hanya GET didukung).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Method tidak diizinkan.
                data: null
                error:
                  code: METHOD_NOT_ALLOWED
components:
  parameters:
    HeroId:
      name: hero_id
      in: path
      required: true
      description: ID unik hero (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 1
    PlayerId:
      name: player_id
      in: path
      required: true
      description: ID unik pemain (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 2
    TeamId:
      name: team_id
      in: path
      required: true
      description: ID unik tim peserta (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 1
    TournamentId:
      name: tournament_id
      in: path
      required: true
      description: ID unik turnamen / season (integer positif)
      schema:
        type: integer
        minimum: 1
        example: 1
    MatchId:
      name: match_id
      in: path
      required: true
      description: ID unik match pertandingan (string)
      schema:
        type: string
        example: s18_w01_m01
    GameId:
      name: game_id
      in: path
      required: true
      description: ID unik game pertandingan (string)
      schema:
        type: string
        example: s18_w01_m01_g01
  schemas:
    SuccessResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Data berhasil diambil.
        data:
          nullable: true
          description: Payload respon
    ErrorResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Terjadi kesalahan.
        data:
          nullable: true
          example: null
        error:
          type: object
          properties:
            code:
              type: string
              example: ERROR_CODE
            detail:
              type: string
    DashboardData:
      type: object
      properties:
        season:
          $ref: '#/components/schemas/Season'
        last_week:
          type: integer
          example: 9
        top_pick_rate:
          type: array
          items:
            type: object
        top_win_rate:
          type: array
          items:
            type: object
        top_ban_rate:
          type: array
          items:
            type: object
        schedule:
          type: array
          items:
            type: object
    Season:
      type: object
      properties:
        season_id:
          type: integer
          example: 1
        league:
          type: string
          example: MPL Indonesia
        season_number:
          type: integer
          example: 18
        phase:
          type: string
          example: Regular Season
        start_date:
          type: string
          format: date
          nullable: true
          example: '2026-08-14'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2026-10-18'
        format:
          type: string
          nullable: true
          example: Double Round Robin, Bo3
    Team:
      type: object
      properties:
        team_id:
          type: integer
          example: 1
        team_name:
          type: string
          example: EVOS
        team_code:
          type: string
          nullable: true
          example: EVOS
        logo_url:
          type: string
          nullable: true
          example: https://cdn.mplanalytic.com/teams/default.png
    Hero:
      type: object
      properties:
        hero_id:
          type: integer
          example: 1
        hero_name:
          type: string
          example: Dyrroth
        role:
          type: string
          example: Fighter
        hero_slug:
          type: string
          example: dyrroth
        hero_url:
          type: string
          nullable: true
          example: https://akmwebstatic.yuanzhanapp.com/web/madmin/image_1604bdeb797af75682b7e3ae3728e3db.png
    Player:
      type: object
      properties:
        player_id:
          type: integer
          example: 2
        player_name:
          type: string
          example: ALBERTTT
        team_id:
          type: integer
          example: 1
        team_name:
          type: string
          example: EVOS
        role:
          type: string
          nullable: true
          example: Jungler
        player_photo_url:
          type: string
          nullable: true
          example: https://cdn.jsdelivr.net/gh/Dani0601/manajemen-proyek-kelompok-4@BEDani/mpl-analytic/public/assets/images/players/alberttt.png
        photo_url:
          type: string
          nullable: true
          example: https://cdn.jsdelivr.net/gh/Dani0601/manajemen-proyek-kelompok-4@BEDani/mpl-analytic/public/assets/images/players/alberttt.png
        status:
          type: string
          enum:
            - active
            - inactive
          example: active
    Item:
      type: object
      properties:
        item_id:
          type: integer
          example: 1
        item_name:
          type: string
          example: Blade of Despair
        category:
          type: string
          example: Attack
        cost:
          type: integer
          example: 3010
        attributes:
          type: object
          example:
            physical_attack: 160
            movement_spd: 5%
