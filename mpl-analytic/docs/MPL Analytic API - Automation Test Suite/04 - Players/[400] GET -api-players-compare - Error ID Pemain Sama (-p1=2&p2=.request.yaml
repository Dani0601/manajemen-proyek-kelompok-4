$kind: http-request
name: "[400] GET /api/players/compare - Error ID Pemain Sama (?p1=2&p2=2)"
description: Kondisi error saat pengguna membandingkan pemain yang sama (p1 == p2).
url: "{{baseUrl}}/api/players/compare?p1={{playerId}}&p2={{playerId}}"
method: GET
headers:
  Accept: application/json
queryParams:
  p1: "{{playerId}}"
  p2: "{{playerId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("[400] Status 400", function () { pm.response.to.have.status(400); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format error (success: false, data: null)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.false;
          pm.expect(j.data).to.be.null;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Error Message] mengandung 'Pemain yang dibandingkan tidak boleh sama'", function () {
          var j = pm.response.json();
          pm.expect(j.message.toLowerCase()).to.include('pemain yang dibandingkan tidak boleh sama');
      });
    language: text/javascript
order: 7000
