$kind: http-request
name: "[400] GET /api/players/compare - Error Parameter p1 & p2 Kosong"
description: Kondisi error saat memanggil endpoint komparasi tanpa menyertakan query params p1 dan p2.
url: "{{baseUrl}}/api/players/compare"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[400] Status 400", function () { pm.response.to.have.status(400); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format error (success: false, data: null)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.false;
          pm.expect(j.data).to.be.null;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Error Message] mengandung 'Parameter p1 dan p2 wajib diisi'", function () {
          var j = pm.response.json();
          pm.expect(j.message.toLowerCase()).to.include('parameter p1 dan p2 wajib diisi');
      });
    language: text/javascript
order: 5000
