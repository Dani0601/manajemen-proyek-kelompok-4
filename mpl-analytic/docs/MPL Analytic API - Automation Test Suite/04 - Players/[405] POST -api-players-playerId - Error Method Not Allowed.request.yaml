$kind: http-request
name: "[405] POST /api/players/:playerId - Error Method Not Allowed"
description: Kondisi error HTTP POST pada detail player.
url: "{{baseUrl}}/api/players/{{playerId}}"
method: POST
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[405] Status 405", function () { pm.response.to.have.status(405); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format error (success: false, data: null)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.false;
          pm.expect(j.data).to.be.null;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Error Code] code adalah 'METHOD_NOT_ALLOWED'", function () {
          var j = pm.response.json();
          pm.expect(j.error && j.error.code).to.eql('METHOD_NOT_ALLOWED');
      });
    language: text/javascript
order: 15000
