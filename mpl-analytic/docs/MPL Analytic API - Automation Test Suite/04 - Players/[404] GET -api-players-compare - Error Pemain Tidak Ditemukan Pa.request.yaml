$kind: http-request
name: "[404] GET /api/players/compare - Error Pemain Tidak Ditemukan Pada Season (?p1=999998&p2=999999)"
description: Kondisi error ketika salah satu atau kedua pemain tidak memiliki data pada season yang dipilih.
url: "{{baseUrl}}/api/players/compare?p1=999998&p2=999999&season=1"
method: GET
headers:
  Accept: application/json
queryParams:
  p1: "999998"
  p2: "999999"
  season: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("[404] Status 404", function () { pm.response.to.have.status(404); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format error (success: false, data: null)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.false;
          pm.expect(j.data).to.be.null;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Error Message] mengandung 'tidak ditemukan'", function () {
          var j = pm.response.json();
          pm.expect(j.message.toLowerCase()).to.include('tidak ditemukan');
      });
    language: text/javascript
order: 8000
