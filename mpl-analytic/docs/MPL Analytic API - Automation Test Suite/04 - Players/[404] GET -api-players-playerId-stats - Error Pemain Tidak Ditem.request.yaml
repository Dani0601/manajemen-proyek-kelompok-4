$kind: http-request
name: "[404] GET /api/players/:playerId/stats - Error Pemain Tidak Ditemukan (999999)"
description: Kondisi error ID pemain tidak ditemukan pada stats pemain.
url: "{{baseUrl}}/api/players/999999/stats"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[404] Status 404", function () { pm.response.to.have.status(404); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format error (success: false, data: null)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.false;
          pm.expect(j.data).to.be.null;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Error Code] code adalah 'PLAYER_NOT_FOUND'", function () {
          var j = pm.response.json();
          pm.expect(j.error && j.error.code).to.eql('PLAYER_NOT_FOUND');
      });
    language: text/javascript
order: 19000
