$kind: http-request
name: "[200] GET /api/players - Berhasil Pagination (?page=1&limit=10)"
description: Pengujian parameter paginasi page dan limit pada endpoint master player.
url: "{{baseUrl}}/api/players?page=1&limit=10"
method: GET
headers:
  Accept: application/json
queryParams:
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format sukses (success: true, message: string)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.true;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Data] Jumlah data maksimal 10 sesuai limit", function () {
          var j = pm.response.json();
          pm.expect(j.data.length).to.be.at.most(10);
      });
    language: text/javascript
order: 2000
