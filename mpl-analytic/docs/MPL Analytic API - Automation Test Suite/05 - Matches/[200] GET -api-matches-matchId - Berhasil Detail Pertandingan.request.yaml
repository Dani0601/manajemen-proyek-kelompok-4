$kind: http-request
name: "[200] GET /api/matches/:matchId - Berhasil Detail Pertandingan"
description: Detail statistik dan skor pertandingan antara 2 tim.
url: "{{baseUrl}}/api/matches/{{matchId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format sukses (success: true, message: string)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.true;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Data] Payload detail match memiliki team1 dan team2", function () {
          var j = pm.response.json();
          pm.expect(j.data).to.be.an('object');
          pm.expect(j.data).to.have.property('match_id');
      });
    language: text/javascript
order: 3000
