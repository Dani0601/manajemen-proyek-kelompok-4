$kind: http-request
name: "[200] GET /api/dashboard - Berhasil (Season Kosong / Tanpa Pertandingan)"
description: Mengambil data dashboard untuk season yang ada tetapi belum ada pertandingan (fallback array kosong).
url: "{{baseUrl}}/api/dashboard?season=99"
method: GET
headers:
  Accept: application/json
queryParams:
  season: "99"
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format sukses (success: true, message: string)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.true;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Data] Mengembalikan array kosong saat season belum memiliki match", function () {
          var j = pm.response.json();
          pm.expect(j.data.schedule).to.be.an('array').that.is.empty;
          pm.expect(j.data.top_pick_rate).to.be.an('array').that.is.empty;
      });
    language: text/javascript
order: 2000
