$kind: http-request
name: "[404] GET /api/dashboard - Error Season Tidak Ditemukan"
description: Kondisi error saat ID season yang dimasukkan tidak ditemukan di sistem database.
url: "{{baseUrl}}/api/dashboard?season=999999"
method: GET
headers:
  Accept: application/json
queryParams:
  season: "999999"
scripts:
  - type: afterResponse
    code: |-
      pm.test("[404] Status 404", function () { pm.response.to.have.status(404); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format error (success: false, data: null)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.false;
          pm.expect(j.data).to.be.null;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Error Code] code adalah 'SEASON_NOT_FOUND'", function () {
          var j = pm.response.json();
          pm.expect(j.error && j.error.code).to.eql('SEASON_NOT_FOUND');
      });
      pm.test("[Error Message] mengandung 'Season tidak ditemukan'", function () {
          var j = pm.response.json();
          pm.expect(j.message.toLowerCase()).to.include('season tidak ditemukan');
      });
    language: text/javascript
order: 3000
