$kind: http-request
name: "[200] GET /api/dashboard - Berhasil (Season Berisi Data)"
description: Mengambil data dashboard untuk season aktif yang memiliki data pertandingan dan statistik hero.
url: "{{baseUrl}}/api/dashboard?season={{seasonId}}"
method: GET
headers:
  Accept: application/json
queryParams:
  season: "{{seasonId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format sukses (success: true, message: string)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.true;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Data] Payload dashboard lengkap (schedule & top_pick_rate)", function () {
          var j = pm.response.json();
          pm.expect(j.data).to.be.an('object');
          pm.expect(j.data.schedule).to.be.an('array');
          pm.expect(j.data.top_pick_rate).to.be.an('array');
      });
    language: text/javascript
order: 1000
