$kind: http-request
name: "[200] GET /api/games/:gameId/emblems - Berhasil Data Emblem Game"
description: Mengambil susunan talent dan emblem pemain dalam game.
url: "{{baseUrl}}/api/games/{{gameId}}/emblems"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200,404] Status salah satu dari 200,404", function () { pm.expect([200,404]).to.include(pm.response.code); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
    language: text/javascript
order: 14000
