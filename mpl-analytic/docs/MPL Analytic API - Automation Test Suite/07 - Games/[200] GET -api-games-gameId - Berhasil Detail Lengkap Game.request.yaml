$kind: http-request
name: "[200] GET /api/games/:gameId - Berhasil Detail Lengkap Game"
description: Mengambil detail komprehensif 1 game (durasi, pemenang, roster).
url: "{{baseUrl}}/api/games/{{gameId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200,404] Status salah satu dari 200,404", function () { pm.expect([200,404]).to.include(pm.response.code); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Response] Valid JSON", function () {
          var j = pm.response.json();
          pm.expect(j).to.have.property('success');
      });
    language: text/javascript
order: 4000
