$kind: http-request
name: "[404] GET /api/games/:gameId/players - Error Game Tidak Ditemukan (invalid_game_xyz)"
description: Kondisi error game players untuk ID game tidak valid.
url: "{{baseUrl}}/api/games/invalid_game_xyz/players"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[404] Status 404", function () { pm.response.to.have.status(404); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format error (success: false, data: null)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.false;
          pm.expect(j.data).to.be.null;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Error Code] code adalah 'GAME_NOT_FOUND'", function () {
          var j = pm.response.json();
          pm.expect(j.error && j.error.code).to.eql('GAME_NOT_FOUND');
      });
    language: text/javascript
order: 9000
