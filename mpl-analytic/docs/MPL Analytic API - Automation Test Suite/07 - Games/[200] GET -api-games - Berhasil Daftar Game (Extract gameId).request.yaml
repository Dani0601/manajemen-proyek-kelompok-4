$kind: http-request
name: "[200] GET /api/games - Berhasil Daftar Game (Extract gameId)"
description: Mengambil daftar game dan mengekstrak gameId aktif.
url: "{{baseUrl}}/api/games"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format sukses (success: true, message: string)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.true;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Data] Menyimpan gameId ke variable", function () {
          var j = pm.response.json();
          pm.expect(j.data).to.be.an('array').that.is.not.empty;
          var g = j.data[0];
          var gid = g.game_id || g.id;
          if (gid) {
              pm.collectionVariables.set("gameId", String(gid));
          }
      });
    language: text/javascript
order: 1000
