$kind: http-request
name: "[200] GET /api/games/:gameId/picks - Berhasil Data Pick Hero Game"
description: Mengambil susunan pick hero pada game terkait.
url: "{{baseUrl}}/api/games/{{gameId}}/picks"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200,404] Status salah satu dari 200,404", function () { pm.expect([200,404]).to.include(pm.response.code); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
    language: text/javascript
order: 11000
