$kind: http-request
name: "[501/200] GET /api/meta - Meta Summary"
description: Endpoint ringkasan meta hero. Mengembalikan 501 jika belum diaktifkan di routing atau 200 jika telah dihubungkan.
url: "{{baseUrl}}/api/meta"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200,501] Status salah satu dari 200,501", function () { pm.expect([200,501]).to.include(pm.response.code); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Response] Format respon valid", function () {
          var j = pm.response.json();
          pm.expect(j).to.have.property('success');
          pm.expect(j).to.have.property('message');
      });
    language: text/javascript
order: 1000
