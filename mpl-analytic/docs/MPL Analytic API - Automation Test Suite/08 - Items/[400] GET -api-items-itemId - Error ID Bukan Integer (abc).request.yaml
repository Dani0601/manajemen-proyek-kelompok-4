$kind: http-request
name: "[400] GET /api/items/:itemId - Error ID Bukan Integer (abc)"
description: Kondisi error validasi item_id bertipe non-integer.
url: "{{baseUrl}}/api/items/abc"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[400] Status 400", function () { pm.response.to.have.status(400); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format error (success: false, data: null)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.false;
          pm.expect(j.data).to.be.null;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Error Code] code adalah 'INVALID_INTEGER'", function () {
          var j = pm.response.json();
          pm.expect(j.error && j.error.code).to.eql('INVALID_INTEGER');
      });
      pm.test("[Error Message] mengandung 'harus berupa angka'", function () {
          var j = pm.response.json();
          pm.expect(j.message.toLowerCase()).to.include('harus berupa angka');
      });
    language: text/javascript
order: 4000
