$kind: http-request
name: "[501] GET /api/items/:itemId - Belum Diimplementasikan (Valid Integer)"
description: Detail spesifik item perlengkapan.
url: "{{baseUrl}}/api/items/{{itemId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[501,200,404] Status salah satu dari 501,200,404", function () { pm.expect([501,200,404]).to.include(pm.response.code); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
    language: text/javascript
order: 3000
