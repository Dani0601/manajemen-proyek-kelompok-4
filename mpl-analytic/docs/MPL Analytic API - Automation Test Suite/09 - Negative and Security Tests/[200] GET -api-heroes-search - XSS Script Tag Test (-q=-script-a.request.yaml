$kind: http-request
name: "[200] GET /api/heroes/search - XSS Script Tag Test (?q=<script>alert(1)</script>)"
description: Memastikan parameter teks aman dari serangan payload XSS.
url: "{{baseUrl}}/api/heroes/search?q=<script>alert(1)</script>"
method: GET
headers:
  Accept: application/json
queryParams:
  q: <script>alert(1)</script>
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Security] Input XSS ditangani dengan aman tanpa eksekusi tak terduga", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.true;
          pm.expect(j.data).to.be.an('array');
      });
    language: text/javascript
order: 6000
