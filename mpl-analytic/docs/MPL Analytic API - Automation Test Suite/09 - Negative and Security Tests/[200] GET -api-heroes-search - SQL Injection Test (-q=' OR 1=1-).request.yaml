$kind: http-request
name: "[200] GET /api/heroes/search - SQL Injection Test (?q=' OR 1=1--)"
description: Memastikan query parameter pencarian aman dari SQL Injection dan tidak menyebabkan crash server (500).
url: "{{baseUrl}}/api/heroes/search?q=' OR 1=1--"
method: GET
headers:
  Accept: application/json
queryParams:
  q: "' OR 1=1--"
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Security] Parameter query ter-escape secara aman dan tidak melempar 500 error", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.true;
          pm.expect(j.data).to.be.an('array');
      });
    language: text/javascript
order: 5000
