$kind: http-request
name: "[200] GET /api/heroes/search - Berhasil Filter Role (?role=Marksman)"
description: Pencarian hero berdasarkan parameter role.
url: "{{baseUrl}}/api/heroes/search?role=Marksman"
method: GET
headers:
  Accept: application/json
queryParams:
  role: Marksman
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format sukses (success: true, message: string)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.true;
          pm.expect(j.message).to.be.a('string');
      });
    language: text/javascript
order: 3000
