$kind: http-request
name: "[200] GET /api/heroes/search - Keyword Tidak Cocok (Empty List)"
description: Pencarian hero dengan keyword fiktif menghasilkan array kosong tanpa error 500.
url: "{{baseUrl}}/api/heroes/search?q=NonExistentHeroX999"
method: GET
headers:
  Accept: application/json
queryParams:
  q: NonExistentHeroX999
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format sukses (success: true, message: string)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.true;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Data] Mengembalikan array kosong jika keyword tidak ada", function () {
          var j = pm.response.json();
          pm.expect(j.data).to.be.an('array').that.is.empty;
      });
    language: text/javascript
order: 5000
