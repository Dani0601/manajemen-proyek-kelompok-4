$kind: http-request
name: "[400] GET /api/heroes/:heroId - Error ID Bernilai 0 atau Negatif (-1)"
description: Kondisi error validasi hero_id bernilai <= 0.
url: "{{baseUrl}}/api/heroes/-1"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[400] Status 400", function () { pm.response.to.have.status(400); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format error (success: false, data: null)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.false;
          pm.expect(j.data).to.be.null;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Error Code] code adalah 'INVALID_HERO_ID'", function () {
          var j = pm.response.json();
          pm.expect(j.error && j.error.code).to.eql('INVALID_HERO_ID');
      });
      pm.test("[Error Message] mengandung 'harus lebih besar dari 0'", function () {
          var j = pm.response.json();
          pm.expect(j.message.toLowerCase()).to.include('harus lebih besar dari 0');
      });
    language: text/javascript
order: 10000
