$kind: http-request
name: "[501] GET /api/heroes/:heroId/games - Status Belum Diimplementasikan"
description: Status 501 jika endpoint riwayat game spesifik hero belum diimplementasikan di controller.
url: "{{baseUrl}}/api/heroes/{{heroId}}/games"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[501,200] Status salah satu dari 501,200", function () { pm.expect([501,200]).to.include(pm.response.code); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
    language: text/javascript
order: 34000
