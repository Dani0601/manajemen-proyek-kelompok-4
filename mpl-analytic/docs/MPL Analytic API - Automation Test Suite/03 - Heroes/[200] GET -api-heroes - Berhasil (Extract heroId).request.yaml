$kind: http-request
name: "[200] GET /api/heroes - Berhasil (Extract heroId)"
description: Mengambil semua data hero dan menyimpan heroId ke dalam environment variable.
url: "{{baseUrl}}/api/heroes"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format sukses (success: true, message: string)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.true;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Data] Berisi array list hero dan set variable heroId", function () {
          var j = pm.response.json();
          pm.expect(j.data).to.be.an('array').that.is.not.empty;
          var hero = j.data[0];
          var id = hero.hero_id || hero.id;
          if (id) {
              pm.collectionVariables.set("heroId", String(id));
          }
      });
    language: text/javascript
order: 1000
