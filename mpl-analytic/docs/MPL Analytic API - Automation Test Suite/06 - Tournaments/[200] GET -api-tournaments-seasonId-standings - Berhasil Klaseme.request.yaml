$kind: http-request
name: "[200] GET /api/tournaments/:seasonId/standings - Berhasil Klasemen Turnamen"
description: Mengambil klasemen peringkat tim pada turnamen yang dipilih.
url: "{{baseUrl}}/api/tournaments/{{seasonId}}/standings"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type adalah JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] Response format sukses (success: true, message: string)", function () {
          var j = pm.response.json();
          pm.expect(j.success).to.be.true;
          pm.expect(j.message).to.be.a('string');
      });
      pm.test("[Data] Standings adalah array klasemen tim", function () {
          var j = pm.response.json();
          pm.expect(j.data).to.be.an('array');
      });
    language: text/javascript
order: 9000
