<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MLBB Guide - Dashboard</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

    body {
        margin: 0;
        background: #555;
    }


    .mobile-app {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;

        margin: 0 auto;

        background: #fff;
        overflow: hidden;
    }


    /* Hero Banner */

    .hero-banner {
        position: relative;

        min-height: 130px;

        background-image:
            url("https://placehold.co/430x180");

        background-size: cover;
        background-position: center;

        border-radius: 0 0 10px 10px;

        overflow: hidden;
    }


    .hero-content {
        position: absolute;

        left: 14px;
        bottom: 14px;

        color: white;

        max-width: 230px;
    }


    .hero-content h1 {
        margin: 0;

        font-size: 17px;
        font-weight: 700;

        line-height: 1.1;
    }


    .hero-content p {
        margin: 8px 0 0;

        font-size: 8px;
        line-height: 1.3;
    }

    /* =========================
   Dashboard Section
========================= */

.dashboard-section {
    padding: 6px 14px 0;
    margin-bottom: 10px;
}


/* Header section */

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 3px;
}

.section-title {
    margin: 0;

    font-size: 15px;
    font-weight: 700;

    color: #1f365d;
}

.see-all {
    font-size: 8px;
    color: #1f365d;

    text-decoration: none;

    white-space: nowrap;
}

.see-all span {
    font-size: 13px;
    vertical-align: -1px;
}


/* =========================
   Hero Horizontal Scroll
========================= */

.hero-scroll {
    display: flex;

    gap: 5px;

    overflow-x: auto;
    overflow-y: hidden;

    padding: 6px 7px 7px;

    border: 1.5px solid #222;
    border-radius: 15px;

    scrollbar-width: none;
}

.hero-scroll::-webkit-scrollbar {
    display: none;
}


/* =========================
   Hero Card
========================= */

.hero-card {
    position: relative;

    flex: 0 0 56px;

    text-align: center;
}


/* Image */

.hero-image-wrapper {
    position: relative;

    width: 48px;
    height: 48px;

    margin: 0 auto 3px;
}

.hero-image {
    width: 48px;
    height: 48px;

    object-fit: cover;

    border-radius: 8px;
}


/* Ranking */

.rank-badge {
    position: absolute;

    top: -3px;
    left: -3px;

    z-index: 2;

    width: 15px;
    height: 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background-color: #2874d0;
    color: white;

    font-size: 8px;
    font-weight: 700;
}


/* Hero name */

.hero-name {
    font-size: 8px;
    font-weight: 500;

    line-height: 1.1;

    white-space: nowrap;
}


/* WR / BR */

.hero-rate {
    display: inline-block;

    margin-top: 2px;
    padding: 2px 4px;

    border-radius: 8px;

    background-color: #dceffc;
    color: #2874d0;

    font-size: 6px;
    font-weight: 600;

    white-space: nowrap;
}

/* =========================
   WR & BR Chart
========================= */

.chart-card {
    border: 1.5px solid #222;
    border-radius: 15px;

    padding: 5px 7px 7px;

    background-color: #fff;
}


/* Legend */

.chart-legend {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 12px;

    margin-bottom: 2px;
}

.legend-item {
    display: flex;
    align-items: center;

    gap: 4px;

    font-size: 7px;
}

.legend-box {
    width: 8px;
    height: 8px;

    display: inline-block;
}

.legend-wr {
    background-color: #2874d0;
}

.legend-br {
    background-color: #f28c28;
}


/* Chart */

.chart-container {
    position: relative;

    width: 100%;
    height: 125px;
}

.chart-container canvas {
    width: 100% !important;
    height: 100% !important;
}

/* =========================
   Jadwal Pertandingan
========================= */

.match-card {
    width: 100%;

    border: 1.5px solid #222;
    border-radius: 15px;

    background-color: #fff;

    overflow: hidden;
}


.match-row {
    min-height: 48px;

    display: grid;

    grid-template-columns: 1fr 45px 1fr;

    align-items: center;

    border-bottom: 1px solid #ddd;
}


/* Hilangkan border pada pertandingan terakhir */

.match-row:last-child {
    border-bottom: none;
}


/* =========================
   Team
========================= */

.team {
    display: flex;

    align-items: center;

    gap: 6px;

    min-width: 0;
}


.team-left {
    justify-content: flex-end;

    text-align: right;
}


.team-right {
    justify-content: flex-start;

    text-align: left;
}


.team-name {
    font-size: 7px;

    color: #285ca8;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.team-logo {
    width: 25px;
    height: 25px;

    object-fit: contain;

    flex-shrink: 0;
}


/* =========================
   VS & Time
========================= */

.match-info {
    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    line-height: 1.1;
}


.match-vs {
    font-size: 7px;

    color: #333;

    font-weight: 500;
}


.match-time {
    font-size: 7px;

    color: #1769d2;

    font-weight: 600;

    margin-top: 2px;
}


</style>

</head>

<body>

    <div class="mobile-app">

        <!-- Navbar -->
        <nav class="navbar bg-white px-3 py-3">

            <div class="container-fluid p-0">

                <!-- Logo -->
                <a
                    href="#"
                    class="navbar-brand d-flex align-items-center gap-2"
                >
                    <strong>MLBB</strong>
                    <span>GUIDE</span>
                </a>


                <!-- Navigation Icon -->
                <div class="d-flex align-items-center gap-3">

                    <button
                        class="btn p-0"
                        type="button"
                    >
                        🔍
                    </button>

                    <button
                        class="btn p-0"
                        type="button"
                    >
                        ☰
                    </button>

                </div>

            </div>

        </nav>


        <!-- Hero Banner -->
        <section class="hero-banner">

            <div class="hero-content">

                <h1>
                    Selamat datang
                    <br>
                    di MLBB Guide
                </h1>

                <p>
                    Temukan hero terbaik, build item,
                    dan strategi untuk menang!
                </p>

            </div>

        </section>


        <!-- Top 5 Overpowered -->
        <section class="dashboard-section">

            <div class="section-header">

                <h2 class="section-title">
                    Top 5 Overpowered (WR)
                </h2>

                <a href="#" class="see-all">
                    Lihat Semua
                    <span>›</span>
                </a>

            </div>


            <div class="hero-scroll" id="topOverpowered">
            </div>

        </section>

        <!-- Top 5 Most Banned -->
        <section class="dashboard-section">

            <div class="section-header">

                <h2 class="section-title">
                    Top 5 Most Banned (BR)
                </h2>

                <a href="#" class="see-all">
                    Lihat Semua
                    <span>›</span>
                </a>

            </div>


            <div class="hero-scroll" id="topMostBanned">
            </div>

        </section>

        <!-- Perbandingan WR dan BR -->
        <section class="dashboard-section">

            <div class="section-header">

                <h2 class="section-title">
                    Perbandingan WR dan BR
                </h2>

                <a href="#" class="see-all">
                    Lihat detail
                    <span>›</span>
                </a>

            </div>


            <div class="chart-card">

                <div class="chart-legend">

                    <div class="legend-item">
                        <span class="legend-box legend-wr"></span>
                        <span>Overpowered (WR)</span>
                    </div>

                    <div class="legend-item">
                        <span class="legend-box legend-br"></span>
                        <span>Most Banned (BR)</span>
                    </div>

                </div>


                <div class="chart-container">

                    <canvas id="wrBrChart"></canvas>

                </div>

            </div>

        </section>

        <!-- Jadwal Pertandingan -->
        <section class="dashboard-section">

            <div class="section-header">

                <h2 class="section-title">
                    ⚔️ Jadwal Pertandingan
                </h2>

                <a href="#" class="see-all">
                    Lihat Semua
                    <span>›</span>
                </a>

            </div>


         <div class="match-card" id="matchList">
</div>

        </section>


    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


        <script>
    // 1. Mock data
    const mockDashboardData = {
    status: "success",
    code: 200,
    message: "Meta summary fetched successfully",

    data: {
        season: 13,

        patch_version: "1.8.66",

        upcoming_match: {
            match_id: 502,

            team_a: {
                name: "Bigetron Alpha",
                logo: "/images/btr.png"
            },

            team_b: {
                name: "ONIC Esports",
                logo: "/images/onic.png"
            },

            scheduled_at: "2026-03-28T15:00:00Z"
        },

        top_picked_heroes: [
            {
                hero_id: 101,
                hero_name: "Nolan",
                primary_role: "Assassin",
                pick_rate: 68.5,
                win_rate: 54.2
            },

            {
                hero_id: 102,
                hero_name: "Joy",
                primary_role: "Assassin",
                pick_rate: 65.2,
                win_rate: 56.8
            },

            {
                hero_id: 103,
                hero_name: "Fanny",
                primary_role: "Assassin",
                pick_rate: 61.4,
                win_rate: 62.8
            },

            {
                hero_id: 104,
                hero_name: "Ling",
                primary_role: "Assassin",
                pick_rate: 58.7,
                win_rate: 58.7
            },

            {
                hero_id: 105,
                hero_name: "Beatrix",
                primary_role: "Marksman",
                pick_rate: 55.3,
                win_rate: 56.3
            }
        ],

        top_banned_heroes: [
            {
                hero_id: 201,
                hero_name: "Lancelot",
                primary_role: "Assassin",
                ban_rate: 78.2,
                win_rate: 54.9
            },

            {
                hero_id: 202,
                hero_name: "Fanny",
                primary_role: "Assassin",
                ban_rate: 72.6,
                win_rate: 62.8
            },

            {
                hero_id: 203,
                hero_name: "Ling",
                primary_role: "Assassin",
                ban_rate: 68.9,
                win_rate: 58.7
            },

            {
                hero_id: 204,
                hero_name: "Hayabusa",
                primary_role: "Assassin",
                ban_rate: 65.4,
                win_rate: 55.2
            },

            {
                hero_id: 205,
                hero_name: "Selena",
                primary_role: "Assassin",
                ban_rate: 61.7,
                win_rate: 57.1
            }
        ]
    }
};

    // 2. Ambil data
    const pickedHeroes =
    mockDashboardData.data.top_picked_heroes;

    const bannedHeroes =
    mockDashboardData.data.top_banned_heroes;



    // 3. label charts
    const chartLabels = [
    ...new Set([
        ...pickedHeroes.map(hero => hero.hero_name),
        ...bannedHeroes.map(hero => hero.hero_name)
    ])
];

        // 4. top 5 overpowered
    const topOverpoweredContainer =
    document.getElementById('topOverpowered');

    pickedHeroes.forEach((hero, index) => {

    topOverpoweredContainer.innerHTML += `
        <div class="hero-card">

            <div class="hero-image-wrapper">

                <span class="rank-badge">
                    ${index + 1}
                </span>

                <img
                    src="https://placehold.co/70x70"
                    alt="${hero.hero_name}"
                    class="hero-image"
                >

            </div>

            <div class="hero-name">
                ${hero.hero_name}
            </div>

            <div class="hero-rate">
                WR ${hero.win_rate}%
            </div>

        </div>
    `;

});

    pickedHeroes.forEach((hero, index) => {

    topOverpoweredContainer.innerHTML += `
        <div class="hero-card">

            <div class="hero-image-wrapper">

                <span class="rank-badge">
                    ${index + 1}
                </span>

                <img
                    src="https://placehold.co/70x70"
                    alt="${hero.hero_name}"
                    class="hero-image"
                >

            </div>

            <div class="hero-name">
                ${hero.hero_name}
            </div>

            <div class="hero-rate">
                WR ${hero.win_rate}%
            </div>

        </div>
    `;

});

    // 5. top 5 most banned
    const topMostBannedContainer =
            document.getElementById('topMostBanned');

        bannedHeroes.forEach((hero, index) => {

            topMostBannedContainer.innerHTML += `
                <div class="hero-card">

                    <div class="hero-image-wrapper">

                        <span class="rank-badge">
                            ${index + 1}
                        </span>

                        <img
                            src="https://placehold.co/70x70"
                            alt="${hero.hero_name}"
                            class="hero-image"
                        >

                    </div>

                    <div class="hero-name">
                        ${hero.hero_name}
                    </div>

                    <div class="hero-rate">
                        BR ${hero.ban_rate}%
                    </div>

                </div>
            `;

        });





    const mockMatches = [
    {
        home_team: "RRQ Hoshi",
        home_logo: "/images/rrq.png",

        away_team: "ONIC Esports",
        away_logo: "/images/onic.png",

        time: "14:00"
    },

    {
        home_team: "EVOS Glory",
        home_logo: "/images/evos.png",

        away_team: "Bigetron Alpha",
        away_logo: "/images/btr.png",

        time: "16:30"
    },

    {
        home_team: "Aura Fire",
        home_logo: "/images/aura.png",

        away_team: "Geek Fam",
        away_logo: "/images/geek.png",

        time: "19:00"
    }
];

    const matchList =
    document.getElementById('matchList');

mockMatches.forEach(match => {

    matchList.innerHTML += `
        <div class="match-row">

            <div class="team team-left">

                <span class="team-name">
                    ${match.home_team}
                </span>

                <img
                    src="https://placehold.co/32x32"
                    alt="${match.home_team}"
                    class="team-logo"
                >

            </div>


            <div class="match-info">

                <span class="match-vs">
                    Vs
                </span>

                <span class="match-time">
                    ${match.time}
                </span>

            </div>


            <div class="team team-right">

                <img
                    src="https://placehold.co/32x32"
                    alt="${match.away_team}"
                    class="team-logo"
                >

                <span class="team-name">
                    ${match.away_team}
                </span>

            </div>

        </div>
    `;

});


// 6. chart.js
const ctx = document.getElementById('wrBrChart');

    new Chart(ctx, {

    type: 'bar',

    data: {

        labels: chartLabels,

        datasets: [

            {
                label: 'Overpowered (WR)',

                data: chartLabels.map(heroName => {

                    const hero = pickedHeroes.find(
                        item => item.hero_name === heroName
                    );

                    return hero ? hero.win_rate : null;

                }),

                backgroundColor: '#2874d0',

                borderRadius: 3,

                barThickness: 5
            },


            {
                label: 'Most Banned (BR)',

                data: chartLabels.map(heroName => {

                    const hero = bannedHeroes.find(
                        item => item.hero_name === heroName
                    );

                    return hero ? hero.ban_rate : null;

                }),

                backgroundColor: '#f28c28',

                borderRadius: 3,

                barThickness: 5
            }

        ]

    },

    options: {

        indexAxis: 'y',

        responsive: true,

        maintainAspectRatio: false,

        plugins: {

            legend: {
                display: false
            },

            tooltip: {
                enabled: true,

                callbacks: {

                    label: function(context) {

                        return context.dataset.label
                            + ': '
                            + context.raw
                            + '%';

                    }

                }

            }

        },

        scales: {

            x: {

                min: 0,

                max: 100,

                ticks: {

                    stepSize: 25,

                    font: {
                        size: 7
                    },

                    callback: function(value) {
                        return value + '%';
                    }

                },

                grid: {
                    color: '#dddddd'
                }

            },

            y: {

                ticks: {

                    font: {
                        size: 7
                    }

                },

                grid: {
                    display: false
                }

            }

        }

    }

});


    </script>

</body>

</html>
