$kind: http-request
name: GET /api/games/:gameId/items
url: "{{baseUrl}}/api/games/{{gameId}}/items"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[Status] 200 or 404", function () { pm.expect([200,404]).to.include(pm.response.code); });
      pm.test("[Schema] valid JSON", function () { var j=pm.response.json(); pm.expect(j).to.have.property("success"); });
    language: text/javascript
order: 6000
