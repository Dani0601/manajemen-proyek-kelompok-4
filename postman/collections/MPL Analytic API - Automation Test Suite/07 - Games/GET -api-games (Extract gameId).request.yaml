$kind: http-request
name: GET /api/games (Extract gameId)
url: "{{baseUrl}}/api/games"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[Status] 200 or 501", function () { pm.expect([200,501]).to.include(pm.response.code); });
      pm.test("[Header] Content-Type JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] valid JSON + extract gameId", function () { var j=pm.response.json(); pm.expect(j).to.have.property("success"); if(j.success&&j.data){var d=Array.isArray(j.data)?j.data:[j.data]; if(d.length>0){var gid=d[0].game_id||d[0].id; if(gid){pm.collectionVariables.set("gameId",String(gid));}}} });
    language: text/javascript
order: 1000
