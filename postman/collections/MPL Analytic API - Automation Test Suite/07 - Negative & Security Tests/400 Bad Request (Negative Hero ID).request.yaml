$kind: http-request
url: "{{baseUrl}}/api/heroes/-99"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[400] Status code is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
      pm.test("[Error] Code is INVALID_HERO_ID", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.be.false;
          pm.expect(json.error.code).to.eql("INVALID_HERO_ID");
      });
    language: text/javascript
order: 3000
