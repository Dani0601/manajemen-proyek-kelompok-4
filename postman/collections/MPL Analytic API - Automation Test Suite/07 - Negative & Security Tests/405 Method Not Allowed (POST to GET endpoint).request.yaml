$kind: http-request
url: "{{baseUrl}}/api/dashboard"
method: POST
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[405] Status code is 405 Method Not Allowed", function () {
          pm.response.to.have.status(405);
      });
      pm.test("[Error] Code is METHOD_NOT_ALLOWED", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.be.false;
          pm.expect(json.error.code).to.eql("METHOD_NOT_ALLOWED");
      });
    language: text/javascript
order: 1000
