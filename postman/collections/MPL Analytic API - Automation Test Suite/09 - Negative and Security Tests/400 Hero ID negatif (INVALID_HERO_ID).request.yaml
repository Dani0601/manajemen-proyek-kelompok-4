$kind: http-request
url: "{{baseUrl}}/api/heroes/-99"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[400] Status 400", function () { pm.response.to.have.status(400); });
      pm.test("[Error] code=INVALID_HERO_ID", function () { var j=pm.response.json(); pm.expect(j.success).to.be.false; pm.expect(j.error.code).to.eql("INVALID_HERO_ID"); });
    language: text/javascript
order: 3000
