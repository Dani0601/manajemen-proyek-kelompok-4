$kind: http-request
url: "{{baseUrl}}/api/heroes/999999"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[404] Status 404", function () { pm.response.to.have.status(404); });
      pm.test("[Error] code=HERO_NOT_FOUND", function () { var j=pm.response.json(); pm.expect(j.success).to.be.false; pm.expect(j.error.code).to.eql("HERO_NOT_FOUND"); });
    language: text/javascript
order: 4000
