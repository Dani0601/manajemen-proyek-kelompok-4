$kind: http-request
name: GET /api/players (Extract playerId)
url: "{{baseUrl}}/api/players"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] players array", function () { var j=pm.response.json(); pm.expect(j.success).to.be.true; pm.expect(j.data).to.be.an("array"); pm.expect(j.data.length).to.be.above(0); pm.expect(j.data[0]).to.have.property("player_id"); pm.collectionVariables.set("playerId",String(j.data[0].player_id)); if(j.data.length>1){pm.collectionVariables.set("player2Id",String(j.data[1].player_id));} });
    language: text/javascript
order: 1000
