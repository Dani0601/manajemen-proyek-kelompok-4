$kind: http-request
url: "{{baseUrl}}/api/players/compare?p1={{playerId}}&p2={{player2Id}}&season={{seasonId}}"
method: GET
headers:
  Accept: application/json
queryParams:
  p1: "{{playerId}}"
  p2: "{{player2Id}}"
  season: "{{seasonId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("[Body] Comparison radar stats exist for both players", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.data).to.have.property("comparison");
          pm.expect(json.data.comparison).to.have.property("player_1");
          pm.expect(json.data.comparison).to.have.property("player_2");

          var p1Stats = json.data.comparison.player_1.stats;
          pm.expect(p1Stats).to.have.all.keys("kill_power", "farm_rate", "survival", "versatility", "objective", "teamfight");
      });
    language: text/javascript
order: 2000
