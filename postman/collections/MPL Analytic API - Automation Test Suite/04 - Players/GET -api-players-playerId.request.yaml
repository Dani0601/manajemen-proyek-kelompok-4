$kind: http-request
name: GET /api/players/:playerId
url: "{{baseUrl}}/api/players/{{playerId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[Status] 200 or 404 or 501", function () { pm.expect([200,404,501]).to.include(pm.response.code); });
      pm.test("[Schema] valid JSON", function () { var j=pm.response.json(); pm.expect(j).to.have.property("success"); pm.expect(j).to.have.property("message"); });
    language: text/javascript
order: 4000
