$kind: http-request
url: "{{baseUrl}}/api/players/{{playerId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[Status] Status code is 200 or valid response", function () {
          pm.expect([200, 404, 501]).to.include(pm.response.code);
      });
      pm.test("[Body] Valid JSON structure", function () {
          var json = pm.response.json();
          pm.expect(json).to.be.an("object");
      });
    language: text/javascript
order: 3000
