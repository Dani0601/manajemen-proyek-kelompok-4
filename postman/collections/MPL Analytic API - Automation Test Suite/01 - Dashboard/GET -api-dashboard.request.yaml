$kind: http-request
name: GET /api/dashboard
url: "{{baseUrl}}/api/dashboard"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Perf] < 3000ms", function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      pm.test("[Schema] success, message, data", function () { var j=pm.response.json(); pm.expect(j).to.have.property("success"); pm.expect(j).to.have.property("message"); pm.expect(j).to.have.property("data"); });
      pm.test("[Schema] data.season.season_id", function () { var j=pm.response.json(); pm.expect(j.success).to.be.true; pm.expect(j.data).to.have.property("season"); if(j.data.season&&j.data.season.season_id){pm.collectionVariables.set("seasonId",String(j.data.season.season_id));} });
      pm.test("[Schema] data.schedule is array", function () { var j=pm.response.json(); pm.expect(j.data.schedule).to.be.an("array"); });
    language: text/javascript
order: 1000
