$kind: http-request
name: GET /api/dashboard (Season Berisi Data)
url: "{{baseUrl}}/api/dashboard?season=1"
method: GET
headers:
  Accept: application/json
queryParams:
  season: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] success, message, data", function () { var j=pm.response.json(); pm.expect(j).to.have.property("success"); pm.expect(j).to.have.property("message"); pm.expect(j).to.have.property("data"); });
      pm.test("[Season Data] Schedule & hero data terisi lengkap", function () { var j=pm.response.json(); pm.expect(j.success).to.be.true; pm.expect(j.data.schedule.length).to.be.above(0); pm.expect(j.data.top_pick_rate.length).to.be.above(0); });
    language: text/javascript
order: 1000
