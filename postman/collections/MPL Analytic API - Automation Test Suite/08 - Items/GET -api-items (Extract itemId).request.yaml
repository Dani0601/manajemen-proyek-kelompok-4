$kind: http-request
name: GET /api/items (Extract itemId)
url: "{{baseUrl}}/api/items"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[Status] 200 or 501", function () { pm.expect([200,501]).to.include(pm.response.code); });
      pm.test("[Header] Content-Type JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] valid JSON + extract itemId", function () { var j=pm.response.json(); pm.expect(j).to.have.property("success"); if(j.success&&j.data&&Array.isArray(j.data)&&j.data.length>0){var iid=j.data[0].item_id||j.data[0].id; if(iid){pm.collectionVariables.set("itemId",String(iid));}} });
    language: text/javascript
order: 1000
