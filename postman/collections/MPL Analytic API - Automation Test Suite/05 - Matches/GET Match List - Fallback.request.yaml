$kind: http-request
name: GET Match List / Fallback
url: "{{baseUrl}}/api/matches"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[Status] Response code is 200 or 501", function () {
          pm.expect([200, 501]).to.include(pm.response.code);
      });
      pm.test("[Body] Returned valid JSON response", function () {
          var json = pm.response.json();
          pm.expect(json).to.be.an("object");
      });
    language: text/javascript
order: 2000
