$kind: http-request
url: "{{baseUrl}}/api/meta"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[Status] Status code is 200 or 501", function () {
          pm.expect([200, 501]).to.include(pm.response.code);
      });
      pm.test("[Body] Structure is valid JSON", function () {
          var json = pm.response.json();
          pm.expect(json).to.be.an("object");
      });
    language: text/javascript
order: 1000
