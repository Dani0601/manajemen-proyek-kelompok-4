$kind: http-request
name: GET /api/heroes/search (Search by name)
url: "{{baseUrl}}/api/heroes/search?q=dyr"
method: GET
headers:
  Accept: application/json
queryParams:
  q: dyr
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("[Header] Content-Type JSON", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Schema] data array", function () { var j=pm.response.json(); pm.expect(j.success).to.be.true; pm.expect(j.data).to.be.an("array"); });
      pm.test("[Data] results match keyword", function () { var j=pm.response.json(); pm.expect(j.data.length).to.be.above(0); j.data.forEach(function(h) { pm.expect(h.hero_name.toLowerCase()).to.include("dyr"); }); });
    language: text/javascript
order: 8000
