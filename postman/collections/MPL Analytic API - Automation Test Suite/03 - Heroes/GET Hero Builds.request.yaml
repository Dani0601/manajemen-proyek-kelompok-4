$kind: http-request
url: "{{baseUrl}}/api/heroes/{{heroId}}/builds"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("[Body] Hero builds returned", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.data).to.not.be.null;
      });
    language: text/javascript
order: 4000
