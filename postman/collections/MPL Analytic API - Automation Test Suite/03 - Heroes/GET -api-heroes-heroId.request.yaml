$kind: http-request
name: GET /api/heroes/:heroId
url: "{{baseUrl}}/api/heroes/{{heroId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("[200] Status 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("[Schema] hero_id matches var", function () { var j=pm.response.json(); pm.expect(j.success).to.be.true; var h=j.data.hero||j.data; pm.expect(h).to.have.property("hero_id"); pm.expect(String(h.hero_id)).to.eql(pm.collectionVariables.get("heroId")); });
    language: text/javascript
order: 2000
